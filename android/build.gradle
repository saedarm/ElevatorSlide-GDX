plugins {
    id 'com.android.application'
}

android {
    namespace 'com.saedarm.elevators'
    compileSdk 36

    defaultConfig {
        applicationId 'com.saedarm.elevators'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.0'
    }

    sourceSets {
        main {
            assets.srcDirs = ['../assets']
            jniLibs.srcDirs = ['libs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Release signing reads keystore.properties in the project root (never committed).
    // Without it, release builds come out unsigned and Play will refuse them.
    def keystoreFile = rootProject.file('keystore.properties')
    def keystore = new Properties()
    if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }
}

configurations { natives }

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"

    // S23 is arm64-v8a; x86_64 is only for the Android Studio emulator.
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"
}

// Unpack the libGDX .so files into libs/<abi> before the APK is packaged.
tasks.register('copyAndroidNatives') {
    doFirst {
        configurations.natives.copy().files.each { jar ->
            def abi = jar.name.endsWith('natives-arm64-v8a.jar') ? 'arm64-v8a' :
                      jar.name.endsWith('natives-x86_64.jar') ? 'x86_64' : null
            if (abi != null) {
                def outputDir = file("libs/$abi")
                outputDir.mkdirs()
                copy {
                    from zipTree(jar)
                    into outputDir
                    include '*.so'
                }
            }
        }
    }
}

tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach {
    dependsOn 'copyAndroidNatives'
}
